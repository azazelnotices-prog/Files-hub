<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AzHub Community - Digital Content & DJ Remixer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0d0f17; color: #ffffff; font-family: sans-serif; }
        .glass-card { background: rgba(22, 27, 46, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- Header / Hero Section -->
    <div class="max-w-2xl mx-auto px-4 pt-8 text-center">
        <div class="w-20 h-20 mx-auto mb-4 bg-gradient-to-tr from-purple-600 to-pink-500 rounded-2xl p-0.5 flex items-center justify-center shadow-lg shadow-purple-500/30">
            <div class="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center">
                <i class="fa-solid fa-compact-disc text-3xl text-purple-400 animate-spin" style="animation-duration: 10s;"></i>
            </div>
        </div>
        <h1 class="text-3xl font-bold bg-gradient-to-r from-white via-slate-200 to-purple-300 bg-clip-text text-transparent">AzHub Community</h1>
        <p class="text-xs text-purple-400 font-semibold mt-1">Digital Content Creator & DJ Remixer</p>
        <p class="text-slate-400 text-xs mt-3 leading-relaxed px-4">ยินดีต้อนรับสู่ **AzHub** ศูนย์รวมไฟล์แจกฟรี เพลงรีมิกซ์ ซาวด์ดนตรี มอดเกม และโปรเจกต์ต่างๆ ดาวน์โหลดได้ฟรี ปลอดภัย 100%!</p>
    </div>

    <!-- Main Content List -->
    <div class="max-w-2xl mx-auto px-4 mt-8">
        <div class="glass-card rounded-2xl p-4 mb-6 flex items-center bg-slate-900/50">
            <i class="fa-solid fa-magnifying-glass text-slate-500 ml-2 mr-3"></i>
            <input type="text" id="searchInput" placeholder="ค้นหาชื่อไฟล์ หรือเพลง..." class="w-full bg-transparent text-sm focus:outline-none text-slate-200">
        </div>

        <div id="fileList" class="space-y-3">
            <div class="text-center py-12 text-slate-500 text-sm">กำลังโหลดรายการไฟล์...</div>
        </div>
    </div>

    <script>
        let allFiles = [];

        async function loadFiles() {
            const listEl = document.getElementById('fileList');
            try {
                const res = await fetch('/api/files');
                if (!res.ok) throw new Error();
                allFiles = await res.json();
                renderFiles(allFiles);
            } catch (err) {
                listEl.innerHTML = `
                    <div class="glass-card rounded-2xl p-6 text-center border-red-500/30">
                        <i class="fa-solid fa-circle-exclamation text-red-400 text-3xl mb-2"></i>
                        <p class="text-red-400 text-sm font-semibold">ไม่สามารถโหลดรายการไฟล์ได้</p>
                    </div>`;
            }
        }

        function renderFiles(files) {
            const listEl = document.getElementById('fileList');
            if (files.length === 0) {
                listEl.innerHTML = `<div class="text-center py-8 text-slate-500 text-sm">ยังไม่มีรายการไฟล์ในขณะนี้</div>`;
                return;
            }

            listEl.innerHTML = files.map(file => `
                <div class="glass-card rounded-2xl p-4 flex flex-col gap-3">
                    <div class="flex items-center justify-between gap-3">
                        <div class="overflow-hidden">
                            <span class="text-[10px] font-bold text-purple-400 bg-purple-500/10 px-2 py-0.5 rounded-full border border-purple-500/20">${file.category}</span>
                            <h3 class="font-semibold text-sm text-slate-100 mt-1 truncate">${file.title}</h3>
                        </div>
                        <a href="${file.downloadUrl}" target="_blank" class="shrink-0 bg-purple-600 hover:bg-purple-500 text-white text-xs font-semibold px-4 py-2 rounded-xl transition flex items-center gap-1.5">
                            <i class="fa-solid fa-download"></i> โหลด
                        </a>
                    </div>
                    ${file.audioUrl ? `<audio controls src="${file.audioUrl}" class="w-full h-8 mt-1 rounded-lg bg-slate-900"></audio>` : ''}
                </div>
            `).join('');
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allFiles.filter(f => f.title.toLowerCase().includes(query) || f.category.toLowerCase().includes(query));
            renderFiles(filtered);
        });

        loadFiles();
    </script>
</body>
</html>
